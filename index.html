function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) {
    h = (h * 31 + s.charCodeAt(i)) >>> 0;
  }
  return h;
}

function getTagStyle(label) {
  if (!label) return "bg-slate-100 text-slate-400 border-slate-200";
  return PALETTE[hashStr(label) % PALETTE.length];
}

function tagLabel(ev) {
  if (ev.dept && ev.grade) return `${ev.dept} ${ev.grade}`;

const pad2 = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const sameDay = (a, b) => ymd(a) === ymd(b);
const addDays = (d, n) => {
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
};
const addMonths = (d, n) => {
  const r = new Date(d);
  r.setMonth(r.getMonth() + n);
  return r;
};
const startOfWeekMon = (d) => {
  const r = new Date(d);
  const day = r.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  return addDays(r, diff);
};

function getMonthDays(viewDate) {
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const lastDate = new Date(year, month + 1, 0).getDate();
  const days = [];
  for (let d = 1; d <= lastDate; d++) days.push(new Date(year, month, d));
  return days;
}

function getWeekdays(anchor) {
  const mon = startOfWeekMon(anchor);
  return [0, 1, 2, 3, 4].map((i) => addDays(mon, i));
}

function weekKeyOf(date) {
  return ymd(startOfWeekMon(date));
}

  const dateColor = isToday ? "text-emerald-600" : dow === 0 ? "text-rose-400" : dow === 6 ? "text-blue-400" : "text-slate-500";

  return (
    <div className={`flex gap-3 border-b border-slate-100 px-3 py-2.5 sm:px-4 ${rowBg} ${isLast ? "border-b-0" : ""}`}>

  const supabase = useMemo(() => {

      } catch (err) {
        console.error("Supabase client init error:", err);

  }, [anonKey]);

  // 앱 데이터 상태
  const [depts, setDepts] = useState(INITIAL_DEPTS);
  const [selectedDepts, setSelectedDepts] = useState(new Set(INITIAL_DEPTS));
  const [selectedGrades, setSelectedGrades] = useState(new Set(GRADES));
  const [events, setEvents] = useState(INITIAL_EVENTS);
  const [adminWorkStatus, setAdminWorkStatus] = useState(buildInitialAdminWorkStatus());

  // 모달 상태들
  const emptyForm = { date: ymd(today), dept: "", grade: "", content: "", password: "" };
  const [eventModal, setEventModal] = useState(null);
  const [form, setForm] = useState(emptyForm);
  const [pwCheckInput, setPwCheckInput] = useState("");
  const [pwCheckError, setPwCheckError] = useState("");

  const [adminModalStage, setAdminModalStage] = useState(null);
  const [adminPwInput, setAdminPwInput] = useState("");
  const [adminPwError, setAdminPwError] = useState("");
  const [adminFormTexts, setAdminFormTexts] = useState({});

  const [deptModalStage, setDeptModalStage] = useState(null);
  const [deptPwInput, setDeptPwInput] = useState("");
  const [deptPwError, setDeptPwError] = useState("");
  const [deptEditRows, setDeptEditRows] = useState([]);

  const fetchAllData = useCallback(async () => {
    if (!supabase) return;
    try {
      const { data: dbEvents, error: evErr } = await supabase.from('events').select('*');
      if (!evErr && dbEvents) setEvents(dbEvents);
    } catch(e) { console.error("Error fetching events:", e); }

    try {
      const { data: dbDepts, error: deptErr } = await supabase.from('depts').select('*').order('id', { ascending: true });
      if (!deptErr && dbDepts && dbDepts.length > 0) {
        const deptNames = dbDepts.map(d => d.name);
        setDepts(deptNames);
        setSelectedDepts(new Set(deptNames));
      }
    } catch(e) { console.error("Error fetching depts:", e); }

    try {
      const { data: dbAdmin, error: adminErr } = await supabase.from('admin_status').select('*');
      if (!adminErr && dbAdmin) {
        const map = {};
        dbAdmin.forEach(item => { map[item.week_key] = item.data; });
        setAdminWorkStatus(map);
      }
    } catch(e) { console.error("Error fetching admin status:", e); }
  }, [supabase]);

  useEffect(() => {
    fetchAllData();
    if (supabase) {
      const interval = setInterval(() => {
        fetchAllData();
      }, 5000);

      let channel = null;
      try {
        channel = supabase.channel('realtime-planner')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'events' }, () => fetchAllData())
          .on('postgres_changes', { event: '*', schema: 'public', table: 'depts' }, () => fetchAllData())
          .on('postgres_changes', { event: '*', schema: 'public', table: 'admin_status' }, () => fetchAllData());

        channel.subscribe((status) => {
          if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
            console.warn("Supabase Realtime fallback to HTTP polling active.");
          }
        });
      } catch (err) {
        console.warn("Polling fallback active.", err);
      }

      return () => {
        clearInterval(interval);
        if (channel && supabase) {
          try {
            supabase.removeChannel(channel);
          } catch (e) {}
        }
      };
    }
  }, [supabase, fetchAllData]);

  const filteredEvents = useMemo(() => {

  }, [events, selectedDepts, selectedGrades]);

  const eventsByDate = useMemo(() => {
    const map = {};
    filteredEvents.forEach((e) => {
      if (!map[e.date]) map[e.date] = [];
      map[e.date].push(e);
    });
    return map;
  }, [filteredEvents]);

  const monthDays = getMonthDays(viewDate);
  const monthLabel = `${viewDate.getFullYear()}년 ${viewDate.getMonth() + 1}월`;
  const weekDates = getWeekdays(weekAnchor);
  const weekStart = weekDates[0];
  const weekEnd = weekDates[4];
  const weekKey = ymd(weekStart);
  const weekLabel = `${weekStart.getMonth() + 1}/${weekStart.getDate()} ~ ${weekEnd.getMonth() + 1}/${weekEnd.getDate()}`;
  const currentWeekTexts = adminWorkStatus[weekKey] || {};

  const toggleInSet = (set, setter, value) => {
    const next = new Set(set);
    if (next.has(value)) next.delete(value);
    else next.add(value);
    setter(next);
  };

  const goPrev = () => (tab === "month" ? setViewDate((d) => addMonths(d, -1)) : setWeekAnchor((d) => addDays(d, -7)));
  const goNext = () => (tab === "month" ? setViewDate((d) => addMonths(d, 1)) : setWeekAnchor((d) => addDays(d, 7)));
  const goToday = () => {
    if (tab === "month") setViewDate(new Date());
    else setWeekAnchor(new Date());
  };

  const openAddEvent = (dateStr) => {
    setForm({ ...emptyForm, date: dateStr || ymd(today) });
    setPwCheckInput("");
    setPwCheckError("");
    setEventModal({ mode: "add" });
  };

  const openEditEvent = (ev) => {
    setForm({ date: ev.date, dept: ev.dept, grade: ev.grade, content: ev.content, password: ev.password });
    setPwCheckInput("");
    setPwCheckError("");
    setEventModal({ mode: "edit", data: ev });
  };

  const closeEventModal = () => setEventModal(null);
  const isValidPw = (v) => /^\d{4}$/.test(v);

  const saveEvent = async () => {
    if (!form.content.trim()) return;
    if (eventModal.mode === "add") {
      if (!isValidPw(form.password)) {
        setPwCheckError("비밀번호는 숫자 4자리로 설정해 주세요.");
        return;
      }
      const newEv = { id: `e${Date.now()}`, ...form };
      if (supabase) {
        await supabase.from('events').insert([newEv]);
      }
      setEvents((prev) => [...prev, newEv]);
      closeEventModal();
    } else {
      if (pwCheckInput !== eventModal.data.password) {
        setPwCheckError("비밀번호가 일치하지 않습니다.");
        return;
      }
      if (supabase) {
        await supabase.from('events').update(form).eq('id', eventModal.data.id);
      }
      setEvents((prev) => prev.map((e) => (e.id === eventModal.data.id ? { ...e, ...form } : e)));
      closeEventModal();
    }
  };

  const deleteEvent = async () => {
    if (pwCheckInput !== eventModal.data.password) {
      setPwCheckError("비밀번호가 일치하지 않습니다.");
      return;
    }
    if (supabase) {
      await supabase.from('events').delete().eq('id', eventModal.data.id);
    }
    setEvents((prev) => prev.filter((e) => e.id !== eventModal.data.id));
    closeEventModal();
  };

  const openMasterPwModal = () => {
    setCurrPwInput("");
    setNewPwInput("");
    setConfirmPwInput("");
    setPwChangeError("");
    setPwChangeSuccess("");
    setMasterPwModalOpen(true);
  };

  const handleMasterPwChange = () => {
    setPwChangeError("");
    setPwChangeSuccess("");

    if (!currPwInput) {
      setPwChangeError("현재 마스터 비밀번호를 입력해주세요.");
      return;
    }
    if (currPwInput !== masterPassword) {
      setPwChangeError("현재 마스터 비밀번호가 일치하지 않습니다.");
      return;
    }
    if (!newPwInput) {
      setPwChangeError("새 마스터 비밀번호를 입력해주세요.");
      return;
    }
    if (newPwInput !== confirmPwInput) {
      setPwChangeError("새 마스터 비밀번호가 일치하지 않습니다.");
      return;
    }

    setMasterPassword(newPwInput);
    localStorage.setItem("sp_master_pw", newPwInput);
    setPwChangeSuccess("마스터 비밀번호가 성공적으로 변경되었습니다.");
    setTimeout(() => {
      setMasterPwModalOpen(false);
    }, 1200);
  };

  const handleResetMasterPw = () => {
    if (confirm("마스터 비밀번호를 초기 비밀번호(1234)로 reset 하시겠습니까?")) {
      setMasterPassword(MASTER_PASSWORD_DEFAULT);
      localStorage.setItem("sp_master_pw", MASTER_PASSWORD_DEFAULT);
      setCurrPwInput("");
      setNewPwInput("");
      setConfirmPwInput("");
      setPwChangeError("");
      setPwChangeSuccess("초기 비밀번호(1234)로 초기화되었습니다.");
      setTimeout(() => {
        setMasterPwModalOpen(false);
      }, 1200);
    }
  };

  const openAdminInput = () => {
    setAdminPwInput("");
    setAdminPwError("");
    setAdminModalStage("password");
  };

  const submitAdminPassword = () => {
    if (adminPwInput !== masterPassword) {
      setAdminPwError("비밀번호가 일치하지 않습니다.");
      return;
    }
    const base = {};
    ADMIN_ROLES.forEach((r) => (base[r] = currentWeekTexts[r] || ""));
    setAdminFormTexts(base);
    setAdminModalStage("edit");
  };

  const saveAdminTexts = async () => {
    const updatedData = { ...adminFormTexts };
    if (supabase) {
      await supabase.from('admin_status').upsert([{ week_key: weekKey, data: updatedData }]);
    }
    setAdminWorkStatus((prev) => ({
      ...prev,
      [weekKey]: updatedData
    }));
    setAdminModalStage(null);
  };

  const closeAdminModal = () => setAdminModalStage(null);

  const openDeptEdit = () => {
    setDeptPwInput("");
    setDeptPwError("");
    setDeptModalStage("password");
  };

  const submitDeptPassword = () => {
    if (deptPwInput !== masterPassword) {
      setDeptPwError("비밀번호가 일치하지 않습니다.");
      return;
    }
    setDeptEditRows(depts.map((d, i) => ({ key: `i${i}`, value: d })));
    setDeptModalStage("edit");
  };

  const updateDeptRow = (key, value) => {
    setDeptEditRows((prev) => prev.map((r) => (r.key === key ? { ...r, value } : r)));
  };

  const addDeptRow = () => {
    setDeptEditRows((prev) => [...prev, { key: `n${Date.now()}`, value: "" }]);
  };

  const removeDeptRow = (key) => {
    setDeptEditRows((prev) => prev.filter((r) => r.key !== key));
  };

  const saveDeptEdits = async () => {
    const renameMap = {};
    depts.forEach((oldName, i) => {
      const row = deptEditRows.find((r) => r.key === `i${i}`);
      renameMap[oldName] = row && row.value.trim() ? row.value.trim() : null;
    });

    const newDepts = deptEditRows.map((r) => r.value.trim()).filter((v) => v.length > 0);
    const dedupedNewDepts = Array.from(new Set(newDepts));

    if (supabase) {
      await supabase.from('depts').delete().neq('id', -1);
      await supabase.from('depts').insert(dedupedNewDepts.map(name => ({ name })));
    }

    setEvents((prev) =>
      prev.map((e) => {
        if (!e.dept) return e;
        const mapped = Object.prototype.hasOwnProperty.call(renameMap, e.dept) ? renameMap[e.dept] : e.dept;
        return { ...e, dept: mapped || "" };
      })
    );

    setSelectedDepts((prev) => {
      const next = new Set();
      prev.forEach((d) => {
        const mapped = Object.prototype.hasOwnProperty.call(renameMap, d) ? renameMap[d] : d;
        if (mapped) next.add(mapped);
      });
      dedupedNewDepts.forEach((nd) => {
        if (!depts.includes(nd)) next.add(nd);
      });
      return next;
    });

    setDepts(dedupedNewDepts);
    setDeptModalStage(null);
  };

  const closeDeptModal = () => setDeptModalStage(null);

  const handleSaveKey = () => {
    if (!keyInput.trim()) return;
    const cleanKey = keyInput.trim();
    localStorage.setItem("sp_anon_key", cleanKey);
    setAnonKey(cleanKey);
    setKeyModalOpen(false);
  };

  return (
    <div className="min-h-screen w-full bg-gradient-to-b from-violet-50 via-white to-white p-4 pb-24 sm:p-6">
      <div className="mx-auto max-w-3xl">

        {/* DB 연결 경고 및 키 등록바 */}
        {!supabase && (
          <div className="mb-4 flex flex-wrap items-center justify-between gap-2 rounded-2xl bg-amber-50 p-3.5 border border-amber-200 text-xs text-amber-800">
            <div className="flex items-center gap-2">
              <span className="font-bold text-amber-600">DB 미연동:</span>
              <span>Supabase Key가 입력되지 않았습니다. 다른 사람과 공유하려면 anon key를 설정해 주세요.</span>
            </div>
            <button
              onClick={() => { setKeyInput(anonKey === DEFAULT_SUPABASE_ANON_KEY ? "" : anonKey); setKeyModalOpen(true); }}
              className="flex items-center gap-1 rounded-lg bg-amber-600 px-3 py-1.5 font-bold text-white hover:bg-amber-700 transition"
            >
              <KeyIcon size={14} /> DB 연동 설정
            </button>
          </div>
        )}

        {/* 헤더 및 우측 액션 영역 */}
        <div className="mb-3 flex items-start justify-between gap-2">
          <div className="flex items-center gap-2.5">
            {/* 교표 이미지 (로딩 실패시 깔끔한 경연 엠블럼으로 자동 대체) */}
            {logoErr ? (
              <div className="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-gradient-to-br from-violet-600 to-indigo-700 text-white font-extrabold text-xs shadow-md ring-2 ring-violet-200">
                경연
              </div>
            ) : (
              <img
                src="./logo.png"
                alt="경연초 교표"
                className="h-11 w-11 shrink-0 object-contain"
                onError={() => setLogoErr(true)}
              />
            )}
            <div>
              <h1 className="text-lg font-extrabold text-slate-800 sm:text-xl">경연초 월별·주간 행사 계획</h1>
              <p className="text-xs text-slate-400">학년·부서별 일정과 관리자 근무 현황을 실시간 공유</p>
            </div>
          </div>

          {/* 우측 상단: [실시간 연동 중] 아래 / 날짜 조작부 위에 위치하는 [마스터 PW 변경] */}
          <div className="flex flex-col items-end gap-1.5 shrink-0">
            {supabase && (
              <button
                onClick={() => { setKeyInput(anonKey); setKeyModalOpen(true); }}
                className="flex items-center gap-1 rounded-xl bg-emerald-100 px-2.5 py-1.5 text-xs font-bold text-emerald-700 border border-emerald-200 hover:bg-emerald-200 transition"
                title="Supabase 실시간 연동 상태입니다"
              >
                <span className="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span>
                실시간 연동 중
              </button>
            )}
            {/* 마스터 PW 변경 버튼 위치 지정: [실시간 연동 중] 아래, 날짜 조작부 위 */}
            <button
              onClick={openMasterPwModal}
              className="flex items-center gap-1.5 rounded-full border border-violet-200 bg-white/90 px-3 py-1 text-xs font-bold text-violet-600 shadow-sm hover:bg-violet-100 transition"
            >
              <ShieldCheckIcon size={14} className="text-violet-600" />
              마스터 PW 변경
            </button>
          </div>
        </div>

        {/* 탭 & 날짜 이동 */}
        <div className="mb-4 space-y-2">
          <div className="flex flex-wrap items-center justify-between gap-3 rounded-2xl bg-white p-2 shadow-sm ring-1 ring-slate-100">
            <div className="flex gap-1 rounded-xl bg-slate-100 p-1">
              <button
                onClick={() => setTab("month")}
                className={`flex items-center gap-1 rounded-lg px-3 py-1.5 text-sm font-semibold transition ${
                  tab === "month" ? "bg-white text-violet-600 shadow-sm" : "text-slate-500 hover:text-slate-700"
                }`}
              >
                <CalendarDaysIcon size={15} /> 월별 일정
              </button>
              <button
                onClick={() => setTab("week")}
                className={`flex items-center gap-1 rounded-lg px-3 py-1.5 text-sm font-semibold transition ${
                  tab === "week" ? "bg-white text-violet-600 shadow-sm" : "text-slate-500 hover:text-slate-700"
                }`}
              >
                <ClipboardListIcon size={15} /> 주간 업무 현황
              </button>
            </div>
            <div className="flex items-center gap-2">
              <button onClick={goPrev} className="rounded-lg p-1.5 text-slate-400 hover:bg-slate-100 hover:text-slate-600">
                <ChevronLeft size={18} />
              </button>
              <span className="min-w-[90px] text-center text-sm font-bold text-slate-700">
                {tab === "month" ? monthLabel : weekLabel}
              </span>
              <button onClick={goNext} className="rounded-lg p-1.5 text-slate-400 hover:bg-slate-100 hover:text-slate-600">
                <ChevronRight size={18} />
              </button>
              <button onClick={goToday} className="ml-1 rounded-lg border border-slate-200 px-2.5 py-1 text-xs font-semibold text-slate-500 hover:bg-slate-50">
                오늘
              </button>
            </div>
          </div>
        </div>

        {/* 필터 */}
        <div className="mb-4 space-y-3 rounded-2xl bg-white p-4 shadow-sm ring-1 ring-slate-100">
          <FilterRow
            label="학년"
            items={GRADES}
            selected={selectedGrades}
            onToggle={(v) => toggleInSet(selectedGrades, setSelectedGrades, v)}
            onAll={() => setSelectedGrades(new Set(GRADES))}
            onNone={() => setSelectedGrades(new Set())}
          />
          <FilterRow
            label="담당 부서"
            items={depts}
            selected={selectedDepts}
            onToggle={(v) => toggleInSet(selectedDepts, setSelectedDepts, v)}
            onAll={() => setSelectedDepts(new Set(depts))}
            onNone={() => setSelectedDepts(new Set())}
            editAction={
              <button
                onClick={openDeptEdit}
                title="마스터 권한으로 부서명 수정"
                className="flex items-center gap-1 rounded-lg bg-violet-100 px-2 py-0.5 text-[11px] font-bold text-violet-600 hover:bg-violet-200 transition"
              >
                <PencilIcon size={11} /> 부서명 수정
              </button>
            }
          />
          <p className="text-[11px] text-slate-400">* 학년/부서가 미지정인 일정은 필터와 관계없이 항상 표시됩니다.</p>
        </div>

        {/* 일정 추가 버튼 */}
        <div className="mb-3 flex justify-end">
          <button
            onClick={() => openAddEvent(tab === "month" ? ymd(today) : ymd(weekDates[0]))}
            className="flex items-center gap-1 rounded-xl bg-violet-500 px-3 py-2 text-xs font-bold text-white shadow-sm shadow-violet-200 hover:bg-violet-600 transition"
          >
            <PlusIcon size={14} /> 일정 추가
          </button>
        </div>

        {/* 본문 콘텐츠 */}
        {tab === "month" ? (
          <div className="overflow-hidden rounded-2xl bg-white shadow-sm ring-1 ring-slate-100">
            {monthDays.map((d, idx) => (
              <DateRow
                key={ymd(d)}
                date={d}
                today={today}
                events={eventsByDate[ymd(d)] || []}
                isLast={idx === monthDays.length - 1}
                onAddEvent={openAddEvent}
                onOpenEvent={openEditEvent}
              />
            ))}
          </div>
        ) : (
          <>
            <div className="overflow-hidden rounded-2xl bg-white shadow-sm ring-1 ring-slate-100">
              {weekDates.map((d, idx) => (
                <DateRow
                  key={ymd(d)}
                  date={d}
                  today={today}
                  events={eventsByDate[ymd(d)] || []}
                  isLast={idx === weekDates.length - 1}
                  onAddEvent={openAddEvent}
                  onOpenEvent={openEditEvent}
                />
              ))}
            </div>

            {/* 관리자 근무 현황 카드 */}
            <div className="mt-4 rounded-2xl bg-white p-4 shadow-sm ring-1 ring-slate-100">
              <div className="mb-3 flex flex-wrap items-center justify-between gap-2">
                <div className="flex items-center gap-2">
                  <h2 className="text-sm font-extrabold text-slate-700">관리자 근무 현황</h2>
                  <span className="text-xs font-semibold text-slate-300">{weekLabel}</span>
                </div>
                <button
                  onClick={openAdminInput}
                  className="flex items-center gap-1 rounded-lg bg-violet-500 px-3 py-1.5 text-xs font-bold text-white shadow-sm shadow-violet-200 hover:bg-violet-600 transition"
                >
                  <LockIcon size={12} /> 입력
                </button>
              </div>
              <div className="grid grid-cols-1 gap-2.5 sm:grid-cols-2">
                {ADMIN_ROLES.map((role) => {
                  const text = currentWeekTexts[role];
                  return (
                    <div key={role} className="rounded-xl bg-slate-50 p-3">
                      <p className="mb-1 text-xs font-extrabold text-slate-500">{role}</p>
                      <p className={`whitespace-pre-wrap text-[13px] leading-snug ${text ? "text-slate-600" : "text-slate-300"}`}>
                        {text || "특이사항 없음"}
                      </p>
                    </div>
                  );
                })}
              </div>
            </div>
          </>
        )}

        {}
        {/* 마스터 비밀번호 변경 모달 */}
        {masterPwModalOpen && (
          <Modal title="관리자 마스터 비밀번호 변경" onClose={() => setMasterPwModalOpen(false)}>
            <div className="space-y-4">
              <p className="text-xs text-slate-500 leading-relaxed">
                부서명 수정 및 관리자 근무 현황 입력 시 사용하는 <span className="font-bold text-slate-700">마스터 인증 비밀번호</span>를 변경합니다. <span className="font-bold text-violet-600">(초기비밀번호:1234)</span>
              </p>

              <div>
                <FieldLabel>현재 마스터 비밀번호</FieldLabel>
                <input
                  type="password"
                  value={currPwInput}
                  onChange={(e) => setCurrPwInput(e.target.value)}
                  className={inputCls}
                  placeholder="현재 비밀번호 입력"
                />
              </div>

              <div>
                <FieldLabel>새 마스터 비밀번호</FieldLabel>
                <input
                  type="password"
                  value={newPwInput}
                  onChange={(e) => setNewPwInput(e.target.value)}
                  className={inputCls}
                  placeholder="새 비밀번호 입력"
                />
              </div>

              <div>
                <FieldLabel>새 마스터 비밀번호 확인</FieldLabel>
                <input
                  type="password"
                  value={confirmPwInput}
                  onChange={(e) => setConfirmPwInput(e.target.value)}
                  className={inputCls}
                  placeholder="새 비밀번호 다시 입력"
                />
              </div>

              {pwChangeError && (
                <p className="text-xs font-semibold text-rose-500">{pwChangeError}</p>
              )}
              {pwChangeSuccess && (
                <p className="text-xs font-semibold text-emerald-600">{pwChangeSuccess}</p>
              )}

              <div className="flex items-center gap-2 pt-1">
                <button
                  onClick={() => setMasterPwModalOpen(false)}
                  className="flex-1 rounded-xl border border-slate-200 bg-white py-2.5 text-sm font-bold text-slate-500 hover:bg-slate-50 transition"
                >
                  취소
                </button>
                <button
                  onClick={handleMasterPwChange}
                  className="flex-1 rounded-xl bg-violet-600 py-2.5 text-sm font-bold text-white hover:bg-violet-700 transition"
                >
                  비밀번호 변경
                </button>
              </div>

              <div className="pt-1">
                <button
                  onClick={handleResetMasterPw}
                  className="w-full rounded-xl border border-rose-100 bg-rose-50/70 py-2.5 text-sm font-bold text-rose-500 hover:bg-rose-100 transition"
                >
                  비밀번호 초기화
                </button>
              </div>
            </div>
          </Modal>
        )}

        {/* Key 설정 모달 */}
        {keyModalOpen && (
          <Modal title="Supabase API Anon Key 설정" onClose={() => setKeyModalOpen(false)} wide>
            <div className="space-y-3">
              <p className="text-xs text-slate-500 leading-relaxed">
                Supabase 대시보드 → <b>Project Settings</b> → <b>API</b> 메뉴에서 복사한 <b>anon (public)</b> 키를 아래에 입력해주세요.
              </p>
              <div>
                <FieldLabel>Anon Key</FieldLabel>
                <textarea
                  rows={4}
                  value={keyInput}
                  onChange={(e) => setKeyInput(e.target.value)}
                  className={inputCls}
                  placeholder="eyJhbGciOiJIUzI1Ni..."
                />
              </div>
              <div className="flex items-center gap-2 pt-2">
                <button onClick={() => setKeyModalOpen(false)} className="flex-1 rounded-xl border border-slate-200 bg-white py-2.5 text-sm font-bold text-slate-500 hover:bg-slate-50 transition">
                  취소
                </button>
                <button onClick={handleSaveKey} className="flex-1 rounded-xl bg-violet-500 py-2.5 text-sm font-bold text-white hover:bg-violet-600 transition">
                  저장 및 연동
                </button>
              </div>
            </div>
          </Modal>
        )}

        {/* 일정 추가/수정 모달 */}
        {eventModal && (
          <Modal title={eventModal.mode === "add" ? "일정 추가" : "일정 수정"} onClose={closeEventModal} wide>
            <div className="space-y-3">
              <div>
                <FieldLabel>날짜</FieldLabel>
                <input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} className={inputCls} />
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <FieldLabel>담당 부서</FieldLabel>
                  <select value={form.dept} onChange={(e) => setForm({ ...form, dept: e.target.value })} className={inputCls}>
                    <option value="">미지정</option>
                    {depts.map((d) => (
                      <option key={d} value={d}>{d}</option>
                    ))}
                  </select>
                </div>
                <div>
                  <FieldLabel>학년 / 구분</FieldLabel>
                  <select value={form.grade} onChange={(e) => setForm({ ...form, grade: e.target.value })} className={inputCls}>
                    <option value="">미지정</option>
                    {GRADES.map((g) => (
                      <option key={g} value={g}>{g}</option>
                    ))}
                  </select>
                </div>
              </div>
              <div>
                <FieldLabel>행사 내용</FieldLabel>
                <textarea
                  value={form.content}
                  onChange={(e) => setForm({ ...form, content: e.target.value })}
                  rows={3}
                  className={inputCls}
                  placeholder="예) 디지털새싹캠프(9:00~12:00, A1실, 5~6학년 10명)"
                />
              </div>

              {eventModal.mode === "add" ? (
                <div>
                  <FieldLabel>비밀번호 (수정/삭제 시 사용할 숫자 4자리)</FieldLabel>
                  <input
                    type="password"
                    inputMode="numeric"
                    maxLength={4}
                    value={form.password}
                    onChange={(e) => setForm({ ...form, password: e.target.value.replace(/\D/g, "").slice(0, 4) })}
                    className={inputCls}
                    placeholder="숫자 4자리"
                  />
                </div>
              ) : (
                <div>
                  <FieldLabel>비밀번호 (숫자 4자리)</FieldLabel>
                  <input
                    type="password"
                    inputMode="numeric"
                    maxLength={4}
                    value={pwCheckInput}
                    onChange={(e) => setPwCheckInput(e.target.value.replace(/\D/g, "").slice(0, 4))}
                    className={inputCls}
                    placeholder="등록 시 설정한 비밀번호"
                  />
                </div>
              )}

              {pwCheckError && <p className="text-xs font-semibold text-rose-500">{pwCheckError}</p>}

              <div className="flex items-center gap-2 pt-1">
                {eventModal.mode === "edit" && (
                  <button
                    onClick={deleteEvent}
                    className="flex items-center gap-1 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2.5 text-sm font-bold text-rose-500 hover:bg-rose-100 transition"
                  >
                    <Trash2Icon size={15} /> 삭제
                  </button>
                )}
                <button onClick={closeEventModal} className="flex-1 rounded-xl border border-slate-200 bg-white py-2.5 text-sm font-bold text-slate-500 hover:bg-slate-50 transition">
                  취소
                </button>
                <button onClick={saveEvent} className="flex-1 rounded-xl bg-violet-500 py-2.5 text-sm font-bold text-white hover:bg-violet-600 transition">
                  {eventModal.mode === "add" ? "추가" : "수정"}
                </button>
              </div>
            </div>
          </Modal>
        )}

        {/* 관리자 근무 현황: 비밀번호 인증 모달 */}
        {adminModalStage === "password" && (
          <Modal title="관리자 인증" onClose={closeAdminModal}>
            <div>
              <FieldLabel>마스터 비밀번호</FieldLabel>
              <input
                type="password"
                autoFocus
                value={adminPwInput}
                onChange={(e) => setAdminPwInput(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && submitAdminPassword()}
                className={inputCls}
                placeholder="비밀번호를 입력하세요"
              />
              {adminPwError && <p className="mt-2 text-xs font-semibold text-rose-500">{adminPwError}</p>}
              <button
                onClick={submitAdminPassword}
                className="mt-4 w-full rounded-xl bg-violet-500 py-2.5 text-sm font-bold text-white hover:bg-violet-600 transition"
              >
                확인
              </button>
              <p className="mt-2 text-center text-[11px] text-slate-400">초기 마스터 비밀번호: {MASTER_PASSWORD_DEFAULT}</p>
            </div>
          </Modal>
        )}

        {/* 관리자 근무 현황: 편집 모달 */}
        {adminModalStage === "edit" && (
          <Modal title={`관리자 근무 현황 작성 (${weekLabel})`} onClose={closeAdminModal} wide>
            <div className="max-h-[60vh] space-y-3 overflow-y-auto pr-1">
              {ADMIN_ROLES.map((role) => (
                <div key={role}>
                  <FieldLabel>{role}</FieldLabel>
                  <textarea
                    value={adminFormTexts[role] || ""}
                    onChange={(e) => setAdminFormTexts({ ...adminFormTexts, [role]: e.target.value })}
                    rows={2}
                    className={inputCls}
                    placeholder="예) 28(금) [출장] 서구3지구 교감단 자율장학협의회 (11:00~16:30, 청라커낼웨이 일대)"
                  />
                </div>
              ))}
            </div>
            <div className="mt-4 flex items-center gap-2">
              <button onClick={closeAdminModal} className="flex-1 rounded-xl border border-slate-200 bg-white py-2.5 text-sm font-bold text-slate-500 hover:bg-slate-50 transition">
                취소
              </button>
              <button onClick={saveAdminTexts} className="flex-1 rounded-xl bg-violet-500 py-2.5 text-sm font-bold text-white hover:bg-violet-600 transition">
                저장
              </button>
            </div>
          </Modal>
        )}

        {/* 부서명 수정: 비밀번호 인증 모달 */}
        {deptModalStage === "password" && (
          <Modal title="마스터 인증" onClose={closeDeptModal}>
            <div>
              <FieldLabel>마스터 비밀번호</FieldLabel>
              <input
                type="password"
                autoFocus
                value={deptPwInput}
                onChange={(e) => setDeptPwInput(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && submitDeptPassword()}
                className={inputCls}
                placeholder="비밀번호를 입력하세요"
              />
              {deptPwError && <p className="mt-2 text-xs font-semibold text-rose-500">{deptPwError}</p>}
              <button
                onClick={submitDeptPassword}
                className="mt-4 w-full rounded-xl bg-violet-500 py-2.5 text-sm font-bold text-white hover:bg-violet-600 transition"
              >
                확인
              </button>
              <p className="mt-2 text-center text-[11px] text-slate-400">초기 마스터 비밀번호: {MASTER_PASSWORD_DEFAULT}</p>
            </div>
          </Modal>
        )}

        {/* 부서명 수정: 편집 모달 */}
        {deptModalStage === "edit" && (
          <Modal title="담당 부서명 수정" onClose={closeDeptModal} wide>
            <div className="max-h-[55vh] space-y-2 overflow-y-auto pr-1">
              {deptEditRows.map((row) => (
                <div key={row.key} className="flex items-center gap-2">
                  <input
                    type="text"
                    value={row.value}
                    onChange={(e) => updateDeptRow(row.key, e.target.value)}
                    className={inputCls}
                    placeholder="부서명"
                  />
                  <button
                    onClick={() => removeDeptRow(row.key)}
                    title="이 부서 삭제"
                    className="shrink-0 rounded-lg p-2 text-slate-300 hover:bg-rose-50 hover:text-rose-500 transition"
                  >
                    <XIcon size={16} />
                  </button>
                </div>
              ))}
            </div>
            <button
              onClick={addDeptRow}
              className="mt-2 flex w-full items-center justify-center gap-1 rounded-xl border border-dashed border-slate-200 py-2 text-xs font-bold text-slate-400 hover:border-violet-300 hover:text-violet-500 transition"
            >
              <PlusIcon size={14} /> 부서 추가
            </button>
            <p className="mt-2 text-[11px] text-slate-400">* 부서명을 삭제하면 해당 부서로 등록된 일정은 '미지정'으로 변경됩니다.</p>
            <div className="mt-4 flex items-center gap-2">
              <button onClick={closeDeptModal} className="flex-1 rounded-xl border border-slate-200 bg-white py-2.5 text-sm font-bold text-slate-500 hover:bg-slate-50 transition">
                취소
              </button>
              <button onClick={saveDeptEdits} className="flex-1 rounded-xl bg-violet-500 py-2.5 text-sm font-bold text-white hover:bg-violet-600 transition">
                저장
              </button>
            </div>
          </Modal>
        )}

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
