<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인천경연초등학교 월별ㆍ주별 행사 계획</title>
  <!-- Tailwind CSS & React CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const GRADES = ["유치원", "1학년", "2학년", "3학년", "4학년", "5학년", "6학년"];
    const INITIAL_DEPTS = ["교무기획", "정보", "혁신연구", "진로인성안전", "특수교육운영", "문화과학", "학생생활", "과학환경", "행정실", "늘봄지원"];
    const ADMIN_ROLES = ["교장", "교감(교무)", "교감(생활)", "행정실장"];
    const WEEKDAY_KOR = ["일", "월", "화", "수", "목", "금", "토"];

    function App() {
      const [isMaster, setIsMaster] = useState(false);
      const [password, setPassword] = useState("1234");
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [showPwModal, setShowPwModal] = useState(false);
      const [inputPw, setInputPw] = useState("");
      const [newPw, setNewPw] = useState("");
      const [currentTab, setCurrentTab] = useState("monthly"); // 'monthly' | 'weekly'

      // 로그인 처리
      const handleLogin = () => {
        if (inputPw === password) {
          setIsMaster(true);
          setShowLoginModal(false);
          setInputPw("");
        } else {
          alert("비밀번호가 일치하지 않습니다.");
        }
      };

      // 비밀번호 변경
      const handleChangePassword = () => {
        if (newPw.trim().length < 4) {
          alert("비밀번호는 4자리 이상 입력해 주세요.");
          return;
        }
        setPassword(newPw);
        setShowPwModal(false);
        setNewPw("");
        alert("비밀번호가 성공적으로 변경되었습니다.");
      };

      return (
        <div class="max-w-6xl mx-auto p-4 md:p-6 space-y-6">
          {/* 헤더 */}
          <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <div>
              <h1 class="text-2xl font-bold text-slate-800">🏫 인천경연초등학교 월별ㆍ주별 행사 계획</h1>
              <p class="text-sm text-slate-500 mt-1">교직원 학사 일정 및 관리자 근무 현황 통합 관리</p>
            </div>
            
            <div class="flex items-center gap-2">
              {isMaster ? (
                <>
                  <span class="px-3 py-1.5 bg-emerald-100 text-emerald-700 text-xs font-semibold rounded-full">🔓 마스터 권한</span>
                  <button onClick={() => setShowPwModal(true)} class="px-3 py-1.5 text-xs font-medium bg-slate-100 hover:bg-slate-200 rounded-xl transition">🔑 비밀번호 변경</button>
                  <button onClick={() => setIsMaster(false)} class="px-3 py-1.5 text-xs font-medium bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-xl transition">🔒 권한 해제</button>
                </>
              ) : (
                <button onClick={() => setShowLoginModal(true)} class="px-4 py-2 text-sm font-medium bg-indigo-600 text-white hover:bg-indigo-700 rounded-xl transition shadow-sm">🔒 마스터 로그인</button>
              )}
            </div>
          </header>

          {/* 탭 메인 영역 */}
          <div class="flex gap-2 border-b border-slate-200 pb-2">
            <button onClick={() => setCurrentTab('monthly')} class={`px-4 py-2 rounded-xl font-medium text-sm transition ${currentTab === 'monthly' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white text-slate-600 hover:bg-slate-100'}`}>📅 월별 일정</button>
            <button onClick={() => setCurrentTab('weekly')} class={`px-4 py-2 rounded-xl font-medium text-sm transition ${currentTab === 'weekly' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white text-slate-600 hover:bg-slate-100'}`}>📋 주간 업무 현황</button>
          </div>

          {/* 오늘의 행사 안내 카드 */}
          <div class="bg-gradient-to-r from-indigo-50 to-sky-50 border border-indigo-100 rounded-2xl p-5 shadow-sm">
            <div class="text-xs font-semibold text-indigo-600 uppercase tracking-wider mb-1">Today's Event</div>
            <div class="text-base font-bold text-slate-800">오늘 예정된 주요 행사가 없습니다.</div>
          </div>

          {/* 안내 및 대시보드 본문 */}
          <div class="bg-white rounded-2xl p-8 border border-slate-100 text-center text-slate-500">
            {currentTab === 'monthly' ? (
              <div>
                <p class="text-lg font-medium text-slate-700">📅 월별 학사 일정 관리 화면</p>
                <p class="text-sm text-slate-400 mt-2">상단 마스터 로그인을 통해 일정을 자유롭게 추가/수정할 수 있습니다.</p>
              </div>
            ) : (
              <div>
                <p class="text-lg font-medium text-slate-700">📋 주간 근무 및 업무 현황 관리 화면</p>
                <p class="text-sm text-slate-400 mt-2">교장, 교감, 행정실장 등 관리자 근무 형태를 등록 및 설정합니다.</p>
              </div>
            )}
          </div>

          {/* 로그인 모달 */}
          {showLoginModal && (
            <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-xl space-y-4">
                <h3 class="text-lg font-bold text-slate-800">🔒 마스터 권한 로그인</h3>
                <p class="text-xs text-slate-500">초기 비밀번호는 <code class="bg-slate-100 px-1 py-0.5 rounded text-indigo-600 font-mono">1234</code> 입니다.</p>
                <input type="password" value={inputPw} onChange={(e) => setInputPw(e.target.value)} placeholder="비밀번호 입력" class="w-full px-4 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                <div class="flex justify-end gap-2">
                  <button onClick={() => setShowLoginModal(false)} class="px-4 py-2 text-xs bg-slate-100 rounded-xl font-medium">취소</button>
                  <button onClick={handleLogin} class="px-4 py-2 text-xs bg-indigo-600 text-white rounded-xl font-medium">확인</button>
                </div>
              </div>
            </div>
          )}

          {/* 비밀번호 변경 모달 */}
          {showPwModal && (
            <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-xl space-y-4">
                <h3 class="text-lg font-bold text-slate-800">🔑 비밀번호 변경</h3>
                <input type="password" value={newPw} onChange={(e) => setNewPw(e.target.value)} placeholder="새 비밀번호 입력" class="w-full px-4 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                <div class="flex justify-end gap-2">
                  <button onClick={() => setShowPwModal(false)} class="px-4 py-2 text-xs bg-slate-100 rounded-xl font-medium">취소</button>
                  <button onClick={handleChangePassword} class="px-4 py-2 text-xs bg-indigo-600 text-white rounded-xl font-medium">변경 저장</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
