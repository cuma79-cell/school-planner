function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) {
    h = (h * 31 + s.charCodeAt(i)) >>> 0;
  }
  return h;
}

function getTagStyle(label) {
  if (!label) return "bg-slate-100 text-slate-400 border-slate-200";
  return PALETTE[hashStr(label) % PALETTE.length];
}

function tagLabel(ev) {
  if (ev.dept && ev.grade) return `${ev.dept} ${ev.grade}`;
  return ev.dept || ev.grade || "전체";
}

const pad2 = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const sameDay = (a, b) => ymd(a) === ymd(b);
const addDays = (d, n) => {
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
};
const addMonths = (d, n) => {
  const r = new Date(d);
  r.setMonth(r.getMonth() + n);
  return r;
};
const startOfWeekMon = (d) => {
  const r = new Date(d);
  const day = r.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  return addDays(r, diff);
};

function getMonthDays(viewDate) {
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const lastDate = new Date(year, month + 1, 0).getDate();
  const days = [];
  for (let d = 1; d <= lastDate; d++) days.push(new Date(year, month, d));
  return days;
}

function getWeekdays(anchor) {
  const mon = startOfWeekMon(anchor);
  return [0, 1, 2, 3, 4].map((i) => addDays(mon, i));
}

function weekKeyOf(date) {
  return ymd(startOfWeekMon(date));
}

function getHolidayName(dateStr, customHolidays) {
  if (customHolidays && customHolidays[dateStr]) {
    return customHolidays[dateStr];
  }
  if (FIXED_HOLIDAYS[dateStr]) {

  }
  const mmdd = dateStr.slice(5);
  if (FIXED_HOLIDAYS[mmdd]) {
    return FIXED_HOLIDAYS[mmdd];
  }
  return null;
}

function DateRow({ date, today, events, isLast, onAddEvent, onOpenEvent, customHolidays }) {
  const dateStr = ymd(date);
  const dow = date.getDay();
  const isToday = sameDay(date, today);
  const holidayName = getHolidayName(dateStr, customHolidays);
  const isHoliday = dow === 0 || !!holidayName;

  const rowBg = isToday ? "bg-emerald-50/70" : isHoliday ? "bg-rose-50/40" : dow === 6 ? "bg-blue-50/30" : "bg-white";
  const dateColor = isToday ? "text-emerald-600" : isHoliday ? "text-rose-500 font-black" : dow === 6 ? "text-blue-400" : "text-slate-500";

  return (
    <div className={`flex gap-3 border-b border-slate-100 px-3 py-2.5 sm:px-4 min-h-[52px] ${rowBg} ${isLast ? "border-b-0" : ""}`}>
      <div className={`flex w-16 shrink-0 flex-col items-start pt-0.5 sm:w-20 ${dateColor}`}>
        <div className="flex items-center gap-1 text-sm font-extrabold">
          {date.getDate()}
          <span className="text-xs font-bold">({WEEKDAY_KOR[dow]})</span>
        </div>
        {holidayName && (
          <span className="mt-0.5 inline-block text-[10px] font-bold leading-tight text-rose-500 break-keep">
            {holidayName}
          </span>
        )}
      </div>
      <div className="min-w-0 flex-1 space-y-1.5">
        {events.length === 0 ? (
          <p className="pt-0.5 text-xs text-slate-300">-</p>
        ) : (
          events.map((ev) => (
            <button key={ev.id} onClick={() => onOpenEvent(ev)} className="flex w-full items-start gap-2 rounded-lg px-1 py-0.5 text-left hover:bg-slate-100/80 transition">
              <Badge className={getTagStyle(tagLabel(ev))}>{tagLabel(ev)}</Badge>
              <span className="pt-0.5 text-[13px] leading-snug text-slate-600">{ev.content}</span>
            </button>
          ))

        <PlusIcon size={16} />
      </button>
    </div>
  );
}

    return () => {
      clearInterval(timer);
      if (channel) supabase.removeChannel(channel);
    };
  }, [supabase, fetchAllData]);

  const filteredEvents = useMemo(() => {
    return events.filter((e) => {
      const deptOk = e.dept === "" || selectedDepts.has(e.dept);
      const gradeOk = e.grade === "" || selectedGrades.has(e.grade);
      return deptOk && gradeOk;
    });
  }, [events, selectedDepts, selectedGrades]);

  const eventsByDate = useMemo(() => {
    const map = {};
    filteredEvents.forEach((e) => {
      if (!map[e.date]) map[e.date] = [];
      map[e.date].push(e);
    });
    return map;
  }, [filteredEvents]);

  const monthDays = getMonthDays(viewDate);
  const monthLabel = `${viewDate.getFullYear()}년 ${viewDate.getMonth() + 1}월`;
  const weekDates = getWeekdays(weekAnchor);
  const weekStart = weekDates[0];
  const weekEnd = weekDates[4];
  const weekKey = ymd(weekStart);
  const weekLabel = `${weekStart.getMonth() + 1}/${weekStart.getDate()} ~ ${weekEnd.getMonth() + 1}/${weekEnd.getDate()}`;
  const currentWeekTexts = adminWorkStatus[weekKey] || {};

  const modalWeekCalculated = useMemo(() => {
    try {
      const d = new Date(adminTargetDate);
      if (isNaN(d.getTime())) return { key: weekKey, label: weekLabel };
      const wDates = getWeekdays(d);
      const wSt = wDates[0];
      const wEn = wDates[4];
      const wK = ymd(wSt);
      const wLbl = `${wSt.getMonth() + 1}/${wSt.getDate()} ~ ${wEn.getMonth() + 1}/${wEn.getDate()}`;
      return { key: wK, label: wLbl };
    } catch {
      return { key: weekKey, label: weekLabel };
    }
  }, [adminTargetDate, weekKey, weekLabel]);

  const handleAdminModalDateChange = (newDateStr) => {
    setAdminTargetDate(newDateStr);
    try {
      const d = new Date(newDateStr);
      if (!isNaN(d.getTime())) {
        const targetWKey = ymd(startOfWeekMon(d));
        const savedData = adminWorkStatus[targetWKey] || {};
        const base = {};
        ADMIN_ROLES.forEach((r) => (base[r] = savedData[r] || ""));
        setAdminFormTexts(base);
      }
    } catch (e) {}
  };

  const toggleInSet = (set, setter, value) => {
    const next = new Set(set);
    if (next.has(value)) next.delete(value);
    else next.add(value);
    setter(next);
  };

  const goPrev = () => (tab === "month" ? setViewDate((d) => addMonths(d, -1)) : setWeekAnchor((d) => addDays(d, -7)));
  const goNext = () => (tab === "month" ? setViewDate((d) => addMonths(d, 1)) : setWeekAnchor((d) => addDays(d, 7)));
  const goToday = () => {
    if (tab === "month") setViewDate(new Date());
    else setWeekAnchor(new Date());
  };

  const openAddEvent = (dateStr) => {
    if (copiedEvent) {
      setForm({
        date: dateStr || ymd(today),
        dept: copiedEvent.dept || "",
        grade: copiedEvent.grade || "",
        content: copiedEvent.content || "",
        password: copiedEvent.password || ""
      });
    } else {
      setForm({ ...emptyForm, date: dateStr || ymd(today) });
    }
    setPwCheckInput("");
    setPwCheckError("");
    setEventModal({ mode: "add" });
  };

  const openEditEvent = (ev) => {
    setForm({ date: ev.date, dept: ev.dept, grade: ev.grade, content: ev.content, password: ev.password });
    setPwCheckInput("");
    setPwCheckError("");
    setEventModal({ mode: "edit", data: ev });
  };

  const copyCurrentEvent = () => {
    if (!form.content.trim()) return;
    setCopiedEvent({
      dept: form.dept,
      grade: form.grade,
      content: form.content,
      password: form.password
    });
    closeEventModal();
  };

  const closeEventModal = () => setEventModal(null);
  const isValidPw = (v) => /^\d{4}$/.test(v);

  const saveEvent = async () => {
    if (!form.content.trim()) return;
    if (eventModal.mode === "add") {
      if (!isValidPw(form.password)) {
        setPwCheckError("비밀번호는 숫자 4자리로 설정해 주세요.");
        return;
      }
      const numericId = Math.floor(Date.now() % 2147483647);
      const newEv = { id: numericId, ...form };
      if (supabase) {
        const { error } = await supabase.from('events').insert([newEv]);
        if (error) {
          setPwCheckError("DB 저장 실패: " + error.message);
          return;
        }
      }
      setEvents((prev) => [...prev, newEv]);
      closeEventModal();
    } else {
      if (pwCheckInput !== eventModal.data.password && pwCheckInput !== masterPassword) {
        setPwCheckError("비밀번호가 일치하지 않습니다.");
        return;
      }
      if (supabase) {
        const { error } = await supabase.from('events').update(form).eq('id', eventModal.data.id);
        if (error) {
          setPwCheckError("DB 수정 실패: " + error.message);
          return;
        }
      }
      setEvents((prev) => prev.map((e) => (e.id === eventModal.data.id ? { ...e, ...form } : e)));
      closeEventModal();
    }
  };

  const deleteEvent = async () => {
    if (pwCheckInput !== eventModal.data.password && pwCheckInput !== masterPassword) {
      setPwCheckError("비밀번호가 일치하지 않습니다.");
      return;
    }
    if (supabase) {
      const { error } = await supabase.from('events').delete().eq('id', eventModal.data.id);
      if (error) {
        setPwCheckError("DB 삭제 실패: " + error.message);
        return;
      }
    }
    setEvents((prev) => prev.filter((e) => e.id !== eventModal.data.id));
    closeEventModal();
  };

  const openMasterPwModal = () => {
    setCurrentPwInput("");
    setNewPwInput("");
    setNewPwConfirmInput("");
    setMasterPwError("");
    setMasterPwSuccess("");
    setMasterPwModalOpen(true);
  };

  const handleSaveMasterPassword = () => {
    setMasterPwError("");
    setMasterPwSuccess("");

    if (currentPwInput !== masterPassword) {
      setMasterPwError("현재 마스터 비밀번호가 일치하지 않습니다.");
      return;
    }
    if (!newPwInput.trim()) {
      setMasterPwError("새 비밀번호를 입력해주세요.");
      return;
    }
    if (newPwInput !== newPwConfirmInput) {
      setMasterPwError("새 비밀번호가 일치하지 않습니다.");
      return;
    }

    const cleanPw = newPwInput.trim();
    localStorage.setItem("sp_master_pw", cleanPw);
    setMasterPassword(cleanPw);
    setMasterPwSuccess("마스터 비밀번호가 성공적으로 변경되었습니다.");
    setTimeout(() => {
      setMasterPwModalOpen(false);
    }, 1200);
  };

  const handleResetMasterPassword = () => {
    if (window.confirm("마스터 비밀번호를 초기값(1234)으로 리셋하시겠습니까?")) {
      localStorage.setItem("sp_master_pw", MASTER_PASSWORD_DEFAULT);
      setMasterPassword(MASTER_PASSWORD_DEFAULT);
      setMasterPwSuccess("마스터 비밀번호가 초기값(1234)으로 리셋되었습니다.");
      setTimeout(() => {
        setMasterPwModalOpen(false);
      }, 1200);
    }
  };

  const openHolidayModal = () => {

    setHolidayPwError("");
    setHolidayModalStage("password");

  const submitHolidayPassword = () => {

      setHolidayPwError("비밀번호가 일치하지 않습니다.");
      return;

    setHolidayModalStage("edit");

    const updated = { ...customHolidays, [newHolDate]: newHolName.trim() };

    localStorage.setItem("sp_custom_holidays", JSON.stringify(updated));
    if (supabase) {
      await supabase.from('admin_status').upsert([{ week_key: 'custom_holidays_data', data: updated }]);
    }
  };

  const removeCustomHoliday = async (dateKey) => {
    const updated = { ...customHolidays };

    setCustomHolidays(updated);
    localStorage.setItem("sp_custom_holidays", JSON.stringify(updated));
    if (supabase) {
      await supabase.from('admin_status').upsert([{ week_key: 'custom_holidays_data', data: updated }]);
    }

  const openAdminInput = (role = 'ALL') => {

    setAdminPwError("");
    setAdminModalStage("password");

  const submitAdminPassword = () => {

      setAdminPwError("비밀번호가 일치하지 않습니다.");
      return;

    const initialWeekKey = modalWeekCalculated.key;

    const base = {};
    ADMIN_ROLES.forEach((r) => (base[r] = savedData[r] || ""));

    setAdminModalStage("edit");

  const saveAdminTexts = async () => {

    if (adminTargetRole && adminTargetRole !== 'ALL') {

        updatedData[sharedRole] = textToCopy;
      });

    const targetWKey = modalWeekCalculated.key;
    if (supabase) {
      await supabase.from('admin_status').upsert([{ week_key: targetWKey, data: updatedData }]);
    }
    setAdminWorkStatus((prev) => ({ ...prev, [targetWKey]: updatedData }));
    setAdminModalStage(null);

  const closeAdminModal = () => setAdminModalStage(null);

  const openDeptEdit = () => {
    setDeptPwInput("");
    setDeptPwError("");
    setDeptModalStage("password");
  };

  const submitDeptPassword = () => {
    if (deptPwInput !== masterPassword) {
      setDeptPwError("비밀번호가 일치하지 않습니다.");
      return;
    }
    setDeptEditRows(depts.map((d, i) => ({ key: `i${i}`, value: d })));
    setDeptModalStage("edit");
  };

  const updateDeptRow = (key, value) => {
    setDeptEditRows((prev) => prev.map((r) => (r.key === key ? { ...r, value } : r)));
  };
  const addDeptRow = () => {
    setDeptEditRows((prev) => [...prev, { key: `n${Date.now()}`, value: "" }]);
  };
  const removeDeptRow = (key) => {
    setDeptEditRows((prev) => prev.filter((r) => r.key !== key));
  };

  const saveDeptEdits = async () => {
    const renameMap = {};
    depts.forEach((oldName, i) => {
      const row = deptEditRows.find((r) => r.key === `i${i}`);
      renameMap[oldName] = row && row.value.trim() ? row.value.trim() : null;
    });
    const newDepts = deptEditRows.map((r) => r.value.trim()).filter((v) => v.length > 0);
    const dedupedNewDepts = Array.from(new Set(newDepts));

    if (supabase) {
      await supabase.from('depts').delete().neq('id', -1);
      await supabase.from('depts').insert(dedupedNewDepts.map(name => ({ name })));
    }

    setEvents((prev) => prev.map((e) => {
      if (!e.dept) return e;
      const mapped = Object.prototype.hasOwnProperty.call(renameMap, e.dept) ? renameMap[e.dept] : e.dept;
      return { ...e, dept: mapped || "" };
    }));

    setSelectedDepts((prev) => {
      const next = new Set();
      prev.forEach((d) => {
        const mapped = Object.prototype.hasOwnProperty.call(renameMap, d) ? renameMap[d] : d;
        if (mapped) next.add(mapped);
      });
      dedupedNewDepts.forEach((nd) => {
        if (!depts.includes(nd)) next.add(nd);
      });
      return next;
    });
    setDepts(dedupedNewDepts);
    setDeptModalStage(null);
  };

  const closeDeptModal = () => setDeptModalStage(null);

  const handleSaveKey = () => {
    if (!keyInput.trim()) return;
    const cleanKey = keyInput.trim();
    localStorage.setItem("sp_anon_key", cleanKey);
    setAnonKey(cleanKey);
    setKeyModalOpen(false);
  };

  return (
    <div className="min-h-screen w-full bg-gradient-to-b from-violet-50 via-white to-white p-4 pb-32 sm:p-6 sm:pb-36">
      <div className="mx-auto max-w-3xl">
        {(!supabase) && (
          <div className="mb-4 flex flex-wrap items-center justify-between gap-2 rounded-2xl bg-amber-50 p-3.5 border border-amber-200 text-xs text-amber-800">
            <div className="flex items-center gap-2">
              <span className="font-bold text-amber-600">DB 미연동:</span>
              <span>Supabase Key가 입력되지 않았습니다. 다른 사람과 공유하려면 anon key를 설정해 주세요.</span>
            </div>
            <button onClick={() => { setKeyInput(anonKey === DEFAULT_SUPABASE_ANON_KEY ? "" : anonKey); setKeyModalOpen(true); }} className="flex items-center gap-1 rounded-lg bg-amber-600 px-3 py-1.5 font-bold text-white hover:bg-amber-700 transition">
              <KeyIcon size={14} /> DB 연동 설정
            </button>
          </div>
        )}

        {copiedEvent && (
          <div className="mb-4 flex items-center justify-between rounded-xl bg-violet-600 px-4 py-2.5 text-white shadow-lg shadow-violet-200">
            <div className="flex items-center gap-2 text-xs truncate">
              <span className="rounded bg-violet-800 px-1.5 py-0.5 font-bold shrink-0">복사됨</span>
              <span className="truncate font-medium">"{copiedEvent.content}" (원하는 날짜의 '+' 버튼을 눌러 붙여넣기하세요)</span>
            </div>
            <button
              onClick={() => setCopiedEvent(null)}
              className="ml-2 shrink-0 rounded-lg bg-violet-700 px-2 py-0.5 text-xs hover:bg-violet-800"
            >
              해제
            </button>
          </div>
        )}

        <div className="mb-4 flex items-center justify-between">
          <div className="flex items-center gap-2.5">
            <img src="./logo.png" alt="경연초 교표" className="h-10 w-10 shrink-0 object-contain" />
            <div>
              <h1 className="text-lg font-extrabold text-slate-800 sm:text-xl">경연초 월별·주간 행사 계획</h1>
              <p className="text-xs text-slate-400">학년·부서별 일정과 관리자 근무 현황을 실시간 공유</p>
            </div>
          </div>

          {supabase && (
            <button onClick={() => { setKeyInput(anonKey); setKeyModalOpen(true); }} className="flex items-center gap-1 rounded-xl bg-emerald-100 px-2.5 py-1.5 text-xs font-bold text-emerald-700 border border-emerald-200 hover:bg-emerald-200 transition" title="Supabase 실시간 연동 상태입니다">
              <span className="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span>
              실시간 연동 중
            </button>
          )}
        </div>

        <div className="mb-2 flex justify-end gap-2">
          <button
            onClick={openHolidayModal}
            className="flex items-center gap-1.5 rounded-full border border-rose-200 bg-white px-3.5 py-1 text-xs font-bold text-rose-600 hover:bg-rose-50 transition shadow-sm"
          >
            <span>🏖️</span>
            재량휴업일 관리
          </button>
          <button
            onClick={openMasterPwModal}
            className="flex items-center gap-1.5 rounded-full border border-violet-200 bg-white px-3.5 py-1 text-xs font-bold text-violet-600 hover:bg-violet-50 transition shadow-sm"
          >
            <ShieldCheckIcon size={14} className="text-violet-500" />

          </button>
        </div>

        <div className="mb-4 flex flex-wrap items-center justify-between gap-3 rounded-2xl bg-white p-2 shadow-sm ring-1 ring-slate-100">
          <div className="flex gap-1 rounded-xl bg-slate-100 p-1">
            <button onClick={() => setTab("month")} className={`flex items-center gap-1 rounded-lg px-3 py-1.5 text-sm font-semibold transition ${tab === "month" ? "bg-white text-violet-600 shadow-sm" : "text-slate-500 hover:text-slate-700"}`}>
              <CalendarDaysIcon size={15} /> 월별 일정
            </button>
            <button onClick={() => setTab("week")} className={`flex items-center gap-1 rounded-lg px-3 py-1.5 text-sm font-semibold transition ${tab === "week" ? "bg-white text-violet-600 shadow-sm" : "text-slate-500 hover:text-slate-700"}`}>
              <ClipboardListIcon size={15} /> 주간 업무 현황
            </button>
          </div>
          <div className="flex items-center gap-2">
            <button onClick={goPrev} className="rounded-lg p-1.5 text-slate-400 hover:bg-slate-100 hover:text-slate-600">
              <ChevronLeft size={18} />
            </button>
            <span className="min-w-[90px] text-center text-sm font-bold text-slate-700">

              <ChevronRight size={18} />
            </button>
            <button onClick={goToday} className="ml-1 rounded-lg border border-slate-200 px-2.5 py-1 text-xs font-semibold text-slate-500 hover:bg-slate-50"> 오늘 </button>
          </div>
        </div>

        <div className="mb-4 space-y-3 rounded-2xl bg-white p-4 shadow-sm ring-1 ring-slate-100">
          <FilterRow label="학년" items={GRADES} selected={selectedGrades} onToggle={(v) => toggleInSet(selectedGrades, setSelectedGrades, v)} onAll={() => setSelectedGrades(new Set(GRADES))} onNone={() => setSelectedGrades(new Set())} />
          <FilterRow label="담당 부서" items={depts} selected={selectedDepts} onToggle={(v) => toggleInSet(selectedDepts, setSelectedDepts, v)} onAll={() => setSelectedDepts(new Set(depts))} onNone={() => setSelectedDepts(new Set())} editAction={
            <button onClick={openDeptEdit} title="마스터 권한으로 부서명 수정" className="flex items-center gap-1 rounded-lg bg-violet-100 px-2 py-0.5 text-[11px] font-bold text-violet-600 hover:bg-violet-200 transition">
              <PencilIcon size={11} /> 부서명 수정
            </button>
          } />
          <p className="text-[11px] text-slate-400">* 학년/부서가 미지정인 일정은 필터와 관계없이 항상 표시됩니다.</p>
        </div>

        <div className="mb-3 flex justify-end">

            <PlusIcon size={14} /> 일정 추가
          </button>
        </div>

        {tab === "month" ? (
          <div className="overflow-hidden rounded-2xl bg-white shadow-sm ring-1 ring-slate-100 mb-8">
            {monthDays.map((d, idx) => (
              <DateRow
                key={ymd(d)}
                date={d}
                today={today}
                events={eventsByDate[ymd(d)] || []}
                isLast={idx === monthDays.length - 1}
                onAddEvent={openAddEvent}
                onOpenEvent={openEditEvent}
                customHolidays={customHolidays}
              />
            ))}
          </div>
        ) : (
          <>
            <div className="overflow-hidden rounded-2xl bg-white shadow-sm ring-1 ring-slate-100">
              {weekDates.map((d, idx) => (
                <DateRow
                  key={ymd(d)}
                  date={d}
                  today={today}
                  events={eventsByDate[ymd(d)] || []}
                  isLast={idx === weekDates.length - 1}
                  onAddEvent={openAddEvent}
                  onOpenEvent={openEditEvent}
                  customHolidays={customHolidays}
                />
              ))}
            </div>

            {/* 관리자 근무 현황 카드 */}
            <div className="mt-4 mb-8 rounded-2xl bg-white p-4 shadow-sm ring-1 ring-slate-100">
              <div className="mb-3 flex flex-wrap items-center justify-between gap-2">
                <div className="flex items-center gap-2">
                  <h2 className="text-sm font-extrabold text-slate-700">관리자 근무 현황</h2>
                  <span className="text-xs font-semibold text-slate-300">{weekLabel}</span>
                </div>
                <button onClick={() => openAdminInput('ALL')} className="flex items-center gap-1 rounded-lg bg-violet-500 px-3 py-1.5 text-xs font-bold text-white shadow-sm shadow-violet-200 hover:bg-violet-600 transition">
                  <LockIcon size={12} /> 입력

                    <div
                      key={role}
                      onClick={() => openAdminInput(role)}
                      className="group relative cursor-pointer rounded-xl bg-slate-50 p-3.5 transition hover:bg-violet-50/60 hover:ring-1 hover:ring-violet-300"
                      title={`${role} 근무 현황 입력`}
                    >
                      <div className="mb-1.5 flex items-center justify-between">
                        <p className="text-xs font-extrabold text-slate-600 group-hover:text-violet-600">{role}</p>
                        <span className="text-[11px] font-semibold text-violet-400 opacity-0 transition group-hover:opacity-100">수정 ✎</span>
                      </div>
                      <p className={`whitespace-pre-wrap text-[13px] leading-snug ${text ? "text-slate-600" : "text-slate-300"}`}>
                        {text || "특이사항 없음"}
                      </p>
                    </div>
                  );
                })}
              </div>
            </div>
          </>

        {/* 1. 관리자 마스터 비밀번호 변경 모달 */}
        {masterPwModalOpen && (
          <Modal title="관리자 마스터 비밀번호 변경" onClose={() => setMasterPwModalOpen(false)}>
            <p className="mb-3 text-xs text-slate-500 leading-relaxed">
              부서명 수정 및 관리자 근무 현황 입력 시 사용하는 <b>마스터 인증 비밀번호</b>를 변경합니다. <span className="text-violet-600 font-bold">(초기비밀번호:1234)</span>
            </p>
            <div className="space-y-3">
              <div>
                <FieldLabel>현재 마스터 비밀번호</FieldLabel>
                <input
                  type="password"
                  value={currentPwInput}
                  onChange={(e) => setCurrentPwInput(e.target.value)}
                  className={inputCls}
                  placeholder="현재 비밀번호 입력"
                />
              </div>
              <div>
                <FieldLabel>새 마스터 비밀번호</FieldLabel>
                <input
                  type="password"
                  value={newPwInput}
                  onChange={(e) => setNewPwInput(e.target.value)}
                  className={inputCls}
                  placeholder="새 비밀번호 입력"
                />
              </div>
              <div>
                <FieldLabel>새 마스터 비밀번호 확인</FieldLabel>
                <input
                  type="password"
                  value={newPwConfirmInput}
                  onChange={(e) => setNewPwConfirmInput(e.target.value)}
                  className={inputCls}
                  placeholder="새 비밀번호 다시 입력"
                />
              </div>

              {masterPwError && <p className="text-xs font-semibold text-rose-500">{masterPwError}</p>}
              {masterPwSuccess && <p className="text-xs font-semibold text-emerald-600">{masterPwSuccess}</p>}

              <div className="flex items-center gap-2 pt-2">
                <button
                  onClick={() => setMasterPwModalOpen(false)}
                  className="flex-1 rounded-xl border border-slate-200 bg-white py-2.5 text-sm font-bold text-slate-500 hover:bg-slate-50 transition"
                >
                  취소
                </button>
                <button
                  onClick={handleSaveMasterPassword}
                  className="flex-1 rounded-xl bg-violet-600 py-2.5 text-sm font-bold text-white hover:bg-violet-700 transition shadow-md shadow-violet-200"
                >
                  비밀번호 변경
                </button>
              </div>

              <div className="pt-2">
                <button
                  onClick={handleResetMasterPassword}
                  className="w-full rounded-xl border border-rose-100 bg-rose-50/70 py-2 text-xs font-bold text-rose-500 hover:bg-rose-100 transition"
                >
                  비밀번호 초기화
                </button>
              </div>
            </div>
          </Modal>
        )}

        {/* 2. 학교 재량휴업일(맞춤 휴일) 모달 */}
        {holidayModalStage === "password" && (
          <Modal title="재량휴업일 관리 인증" onClose={() => setHolidayModalStage(null)}>
            <FieldLabel>마스터 비밀번호</FieldLabel>
            <input
              type="password"
              autoFocus
              value={holidayPwInput}
              onChange={(e) => setHolidayPwInput(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && submitHolidayPassword()}
              className={inputCls}
              placeholder="마스터 비밀번호 입력"
            />
            {holidayPwError && <p className="mt-2 text-xs font-semibold text-rose-500">{holidayPwError}</p>}
            <button onClick={submitHolidayPassword} className="mt-4 w-full rounded-xl bg-rose-500 py-2.5 text-sm font-bold text-white hover:bg-rose-600 transition">
              확인
            </button>
          </Modal>
        )}

        {holidayModalStage === "edit" && (
          <Modal title="학교 재량휴업일 및 휴일 관리" onClose={() => setHolidayModalStage(null)} wide>
            <div className="space-y-4">
              <div className="rounded-xl bg-rose-50/60 p-3 border border-rose-100">
                <p className="text-xs font-bold text-rose-700 mb-2">새 재량휴업일 등록</p>
                <div className="flex flex-col sm:flex-row gap-2">
                  <input
                    type="date"
                    value={newHolDate}
                    onChange={(e) => setNewHolDate(e.target.value)}
                    className="rounded-lg border border-slate-200 bg-white px-2.5 py-1.5 text-xs text-slate-700 outline-none focus:border-rose-400"
                  />
                  <input
                    type="text"
                    value={newHolName}
                    onChange={(e) => setNewHolName(e.target.value)}
                    placeholder="휴일 명칭 (예: 개교기념일)"
                    className="flex-1 rounded-lg border border-slate-200 bg-white px-2.5 py-1.5 text-xs text-slate-700 outline-none focus:border-rose-400"
                  />
                  <button
                    onClick={addCustomHoliday}
                    className="rounded-lg bg-rose-500 px-3 py-1.5 text-xs font-bold text-white hover:bg-rose-600 transition shrink-0"
                  >
                    추가
                  </button>
                </div>
              </div>

              <div>
                <p className="text-xs font-bold text-slate-500 mb-2">등록된 재량휴업일 목록</p>
                <div className="max-h-48 overflow-y-auto space-y-1.5 pr-1">
                  {Object.keys(customHolidays).length === 0 ? (
                    <p className="text-xs text-slate-400 py-2 text-center">등록된 재량휴업일이 없습니다.</p>
                  ) : (
                    Object.entries(customHolidays).map(([dStr, name]) => (
                      <div key={dStr} className="flex items-center justify-between rounded-lg bg-slate-50 px-3 py-2 text-xs">
                        <div className="flex items-center gap-2">
                          <span className="font-bold text-slate-700">{dStr}</span>
                          <span className="rounded bg-rose-100 text-rose-600 px-2 py-0.5 font-bold text-[11px]">{name}</span>
                        </div>
                        <button
                          onClick={() => removeCustomHoliday(dStr)}
                          className="text-slate-400 hover:text-rose-500 transition p-1"
                          title="삭제"
                        >
                          <XIcon size={14} />
                        </button>
                      </div>
                    ))
                  )}
                </div>
              </div>

              <div className="pt-2">
                <button
                  onClick={() => setHolidayModalStage(null)}
                  className="w-full rounded-xl border border-slate-200 bg-white py-2.5 text-sm font-bold text-slate-600 hover:bg-slate-50 transition"
                >
                  닫기
                </button>
              </div>
            </div>
          </Modal>
        )}

        {/* 3. Supabase API Anon Key 모달 */}
        {keyModalOpen && (
          <Modal title="Supabase API Anon Key 설정" onClose={() => setKeyModalOpen(false)} wide>
            <div className="space-y-3">
              <p className="text-xs text-slate-500 leading-relaxed">
                Supabase 대시보드 ➔ <b>Project Settings</b> ➔ <b>API</b> 메뉴에서 복사한 <b>anon (public)</b> 키를 아래에 입력해주세요.
              </p>
              <div>
                <FieldLabel>Anon Key</FieldLabel>
                <textarea rows={4} value={keyInput} onChange={(e) => setKeyInput(e.target.value)} className={inputCls} placeholder="eyJhbGciOiJKV1QiLC..." />
              </div>
              <div className="flex items-center gap-2 pt-2">
                <button onClick={() => setKeyModalOpen(false)} className="flex-1 rounded-xl border border-slate-200 bg-white py-2.5 text-sm font-bold text-slate-500 hover:bg-slate-50 transition"> 취소 </button>
                <button onClick={handleSaveKey} className="flex-1 rounded-xl bg-violet-500 py-2.5 text-sm font-bold text-white hover:bg-violet-600 transition"> 저장 및 연동 </button>
              </div>
            </div>
          </Modal>
        )}

        {/* 4. 일정 추가/수정 모달 */}
        {eventModal && (
          <Modal title={eventModal.mode === "add" ? "일정 추가" : "일정 수정"} onClose={closeEventModal} wide>
            <div className="space-y-3">
              <div>
                <FieldLabel>날짜</FieldLabel>
                <input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} className={inputCls} />
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <FieldLabel>담당 부서</FieldLabel>
                  <select value={form.dept} onChange={(e) => setForm({ ...form, dept: e.target.value })} className={inputCls}>
                    <option value="">미지정</option>
                    {depts.map((d) => ( <option key={d} value={d}>{d}</option> ))}
                  </select>
                </div>
                <div>
                  <FieldLabel>학년 / 구분</FieldLabel>
                  <select value={form.grade} onChange={(e) => setForm({ ...form, grade: e.target.value })} className={inputCls}>
                    <option value="">미지정</option>
                    {GRADES.map((g) => ( <option key={g} value={g}>{g}</option> ))}
                  </select>
                </div>
              </div>
              <div>
                <FieldLabel>행사 내용</FieldLabel>
                <textarea value={form.content} onChange={(e) => setForm({ ...form, content: e.target.value })} rows={3} className={inputCls} placeholder="예) 디지털새싹캠프(9:00~12:00, A1실, 5~6학년 10명)" />
              </div>
              {eventModal.mode === "add" ? (
                <div>
                  <FieldLabel>비밀번호 (수정/삭제 시 사용할 숫자 4자리)</FieldLabel>
                  <input type="password" inputMode="numeric" maxLength={4} value={form.password} onChange={(e) => setForm({ ...form, password: e.target.value.replace(/\D/g, "").slice(0, 4) })} className={inputCls} placeholder="숫자 4자리" />
                </div>
              ) : (
                <div>
                  <FieldLabel>비밀번호 (등록 비밀번호 또는 마스터 PW)</FieldLabel>
                  <input type="password" value={pwCheckInput} onChange={(e) => setPwCheckInput(e.target.value)} className={inputCls} placeholder="비밀번호 입력" />
                </div>
              )}
              {pwCheckError && <p className="text-xs font-semibold text-rose-500">{pwCheckError}</p>}
              <div className="flex items-center gap-2 pt-1">
                {eventModal.mode === "edit" && (
                  <>
                    <button onClick={deleteEvent} className="flex items-center gap-1 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2.5 text-sm font-bold text-rose-500 hover:bg-rose-100 transition" title="일정 삭제">
                      <Trash2Icon size={15} /> 삭제
                    </button>
                    <button onClick={copyCurrentEvent} className="flex items-center gap-1 rounded-xl border border-violet-200 bg-violet-50 px-3 py-2.5 text-sm font-bold text-violet-600 hover:bg-violet-100 transition" title="이 일정의 내용을 복사합니다">
                      <CopyIcon size={15} /> 복사
                    </button>
                  </>
                )}
                <button onClick={closeEventModal} className="flex-1 rounded-xl border border-slate-200 bg-white py-2.5 text-sm font-bold text-slate-500 hover:bg-slate-50 transition"> 취소 </button>
                <button onClick={saveEvent} className="flex-1 rounded-xl bg-violet-500 py-2.5 text-sm font-bold text-white hover:bg-violet-600 transition"> {eventModal.mode === "add" ? "추가" : "수정"} </button>
              </div>
            </div>
          </Modal>
        )}

        {/* 5. 관리자 근무 현황 인증 모달 */}
        {adminModalStage === "password" && (
          <Modal title="관리자 인증" onClose={closeAdminModal}>
            <FieldLabel>마스터 비밀번호</FieldLabel>
            <input type="password" autoFocus value={adminPwInput} onChange={(e) => setAdminPwInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submitAdminPassword()} className={inputCls} placeholder="비밀번호를 입력하세요" />
            {adminPwError && <p className="mt-2 text-xs font-semibold text-rose-500">{adminPwError}</p>}
            <button onClick={submitAdminPassword} className="mt-4 w-full rounded-xl bg-violet-500 py-2.5 text-sm font-bold text-white hover:bg-violet-600 transition"> 확인 </button>
            <p className="mt-2 text-center text-[11px] text-slate-300">기본 마스터 비밀번호: {MASTER_PASSWORD_DEFAULT}</p>
          </Modal>
        )}

        {/* 6. 관리자 근무 현황 작성 모달 (동행 관리자 선택 기능 탑재) */}
        {adminModalStage === "edit" && (
          <Modal
            title={adminTargetRole && adminTargetRole !== 'ALL' ? `${adminTargetRole} 근무 현황 작성` : `관리자 근무 현황 작성`}
            onClose={closeAdminModal}
            wide
          >
            <div className="mb-4 rounded-xl bg-violet-50/70 p-3 border border-violet-100 space-y-2.5">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                <div>
                  <FieldLabel>기준 날짜 (해당 주간 자동 지정)</FieldLabel>
                  <input
                    type="date"
                    value={adminTargetDate}
                    onChange={(e) => handleAdminModalDateChange(e.target.value)}
                    className="rounded-lg border border-slate-200 bg-white px-2.5 py-1.5 text-xs text-slate-700 outline-none focus:border-violet-400"
                  />
                </div>
                <div className="text-right">
                  <span className="text-[11px] font-bold text-slate-400 block">적용 주간</span>
                  <span className="text-xs font-extrabold text-violet-600">{modalWeekCalculated.label}</span>
                </div>
              </div>

              {/* 동행 관리자 체크박스 (개별 직책 편집 시 표시) */}
              {adminTargetRole && adminTargetRole !== 'ALL' && (
                <div className="pt-2 border-t border-violet-200/60">
                  <p className="text-[11px] font-bold text-violet-700 mb-1.5">동행 관리자 함께 등록 (선택 시 동일 내용이 함께 저장됩니다)</p>
                  <div className="flex flex-wrap gap-1.5">
                    {ADMIN_ROLES.filter(r => r !== adminTargetRole).map((r) => {
                      const isChecked = adminSharedRoles.has(r);
                      return (
                        <button
                          key={r}
                          type="button"
                          onClick={() => toggleInSet(adminSharedRoles, setAdminSharedRoles, r)}
                          className={`rounded-lg px-2.5 py-1 text-xs font-bold border transition ${
                            isChecked
                              ? "bg-violet-600 text-white border-violet-600 shadow-sm"
                              : "bg-white text-slate-600 border-slate-200 hover:bg-violet-50"
                          }`}
                        >
                          {isChecked ? `✓ ${r}` : `+ ${r}`}
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>

            <div className="max-h-[50vh] space-y-3 overflow-y-auto pr-1">
              {(adminTargetRole && adminTargetRole !== 'ALL' ? [adminTargetRole] : ADMIN_ROLES).map((role) => (
                <div key={role}>
                  <FieldLabel>{role}</FieldLabel>
                  <textarea
                    value={adminFormTexts[role] || ""}
                    onChange={(e) => setAdminFormTexts({ ...adminFormTexts, [role]: e.target.value })}
                    rows={adminTargetRole && adminTargetRole !== 'ALL' ? 4 : 2}
                    className={inputCls}
                    placeholder="예) 28(금) [출장] 서구3지구 교감단 자율장학협의회"
                  />
                </div>
              ))}
            </div>
            <div className="mt-4 flex items-center gap-2">
              <button onClick={closeAdminModal} className="flex-1 rounded-xl border border-slate-200 bg-white py-2.5 text-sm font-bold text-slate-500 hover:bg-slate-50 transition"> 취소 </button>
              <button onClick={saveAdminTexts} className="flex-1 rounded-xl bg-violet-500 py-2.5 text-sm font-bold text-white hover:bg-violet-600 transition"> 저장 </button>
            </div>
          </Modal>
        )}

        {/* 7. 부서명 수정 인증 모달 */}
        {deptModalStage === "password" && (
          <Modal title="마스터 인증" onClose={closeDeptModal}>
            <FieldLabel>마스터 비밀번호</FieldLabel>
            <input type="password" autoFocus value={deptPwInput} onChange={(e) => setDeptPwInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submitDeptPassword()} className={inputCls} placeholder="비밀번호를 입력하세요" />
            {deptPwError && <p className="mt-2 text-xs font-semibold text-rose-500">{deptPwError}</p>}
            <button onClick={submitDeptPassword} className="mt-4 w-full rounded-xl bg-violet-500 py-2.5 text-sm font-bold text-white hover:bg-violet-600 transition"> 확인 </button>
            <p className="mt-2 text-center text-[11px] text-slate-300">기본 마스터 비밀번호: {MASTER_PASSWORD_DEFAULT}</p>
          </Modal>
        )}

        {/* 8. 부서명 수정 편집 모달 */}
        {deptModalStage === "edit" && (
          <Modal title="담당 부서명 수정" onClose={closeDeptModal} wide>
            <div className="max-h-[55vh] space-y-2 overflow-y-auto pr-1">
              {deptEditRows.map((row) => (
                <div key={row.key} className="flex items-center gap-2">
                  <input type="text" value={row.value} onChange={(e) => updateDeptRow(row.key, e.target.value)} className={inputCls} placeholder="부서명" />
                  <button onClick={() => removeDeptRow(row.key)} title="이 부서 삭제" className="shrink-0 rounded-lg p-2 text-slate-300 hover:bg-rose-50 hover:text-rose-500 transition">
                    <XIcon size={16} />
                  </button>
                </div>
              ))}
            </div>
            <button onClick={addDeptRow} className="mt-2 flex w-full items-center justify-center gap-1 rounded-xl border border-dashed border-slate-200 py-2 text-xs font-bold text-slate-400 hover:border-violet-300 hover:text-violet-500 transition">
              <PlusIcon size={14} /> 부서 추가
            </button>
            <p className="mt-2 text-[11px] text-slate-400">* 부서명을 삭제하면 해당 부서로 등록된 일정은 '미지정'으로 변경됩니다.</p>
            <div className="mt-4 flex items-center gap-2">
              <button onClick={closeDeptModal} className="flex-1 rounded-xl border border-slate-200 bg-white py-2.5 text-sm font-bold text-slate-500 hover:bg-slate-50 transition"> 취소 </button>
              <button onClick={saveDeptEdits} className="flex-1 rounded-xl bg-violet-500 py-2.5 text-sm font-bold text-white hover:bg-violet-600 transition"> 저장 </button>
            </div>
          </Modal>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
